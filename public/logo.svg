<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#FBF3E7" />
      <stop offset="100%" stop-color="#F2E3CE" />
    </radialGradient>

    <!-- Gold Foil Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="35%" stop-color="#F3E5AB" />
      <stop offset="70%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#C9A227" />
    </linearGradient>

    <!-- Wine Gradient -->
    <linearGradient id="wineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#912344" />
      <stop offset="50%" stop-color="#7A1F3A" />
      <stop offset="100%" stop-color="#541225" />
    </linearGradient>

    <!-- Filter for subtle drop shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2B1B14" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Circular Card / Badge Background -->
  <circle cx="250" cy="250" r="236" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="5" filter="url(#softShadow)"/>
  
  <!-- Outer Decorative Ring -->
  <circle cx="250" cy="250" r="222" fill="none" stroke="#7A1F3A" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <circle cx="250" cy="250" r="214" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>

  <!-- Botanical / Paisley Flourish Top Motif -->
  <g transform="translate(250, 112) scale(0.95)" fill="url(#goldGrad)">
    <!-- Central lotus petal -->
    <path d="M0 -30 C12 -15, 16 0, 0 15 C-16 0, -12 -15, 0 -30 Z" />
    <!-- Left petals -->
    <path d="M-6 -22 C-22 -14, -28 5, -8 12 C-14 0, -16 -12, -6 -22 Z" />
    <path d="M-12 -10 C-32 2, -32 20, -14 18 C-20 8, -20 -2, -12 -10 Z" />
    <!-- Right petals -->
    <path d="M6 -22 C22 -14, 28 5, 8 12 C14 0, 16 -12, 6 -22 Z" />
    <path d="M12 -10 C32 2, 32 20, 14 18 C20 8, 20 -2, 12 -10 Z" />
    <!-- Decorative dots -->
    <circle cx="0" cy="-38" r="3.5" />
    <circle cx="-18" cy="-28" r="2.5" />
    <circle cx="18" cy="-28" r="2.5" />
    <circle cx="-32" cy="-12" r="2" />
    <circle cx="32" cy="-12" r="2" />
  </g>

  <!-- Central Brand Name "Aboli" -->
  <text x="250" y="242" 
        font-family="'Playfair Display', Georgia, serif" 
        font-size="82" 
        font-weight="700" 
        font-style="italic"
        letter-spacing="2"
        fill="url(#wineGrad)" 
        text-anchor="middle">Aboli</text>

  <!-- Decorative Divider with Gold Stars -->
  <g transform="translate(250, 268)">
    <line x1="-120" y1="0" x2="-25" y2="0" stroke="url(#goldGrad)" stroke-width="1.5" />
    <polygon points="0,-6 2,-2 6,0 2,2 0,6 -2,2 -6,0 -2,-2" fill="#C9A227" />
    <circle cx="-14" cy="0" r="2" fill="#7A1F3A" />
    <circle cx="14" cy="0" r="2" fill="#7A1F3A" />
    <line x1="25" y1="0" x2="120" y2="0" stroke="url(#goldGrad)" stroke-width="1.5" />
  </g>

  <!-- Subheading: BAG BOUTIQUE & JEWELLERY -->
  <text x="250" y="304" 
        font-family="'Poppins', 'Lato', sans-serif" 
        font-size="16" 
        font-weight="600" 
        letter-spacing="5.5" 
        fill="#7A1F3A" 
        text-anchor="middle">BAG BOUTIQUE</text>
  
  <text x="250" y="328" 
        font-family="'Poppins', 'Lato', sans-serif" 
        font-size="11.5" 
        font-weight="500" 
        letter-spacing="4" 
        fill="#AA771C" 
        text-anchor="middle">&amp; DESIGNER JEWELLERY</text>

  <!-- Location Badge: SATARA -->
  <g transform="translate(250, 368)">
    <rect x="-56" y="-12" width="112" height="24" rx="12" fill="#7A1F3A" />
    <text x="0" y="4.5" 
          font-family="'Poppins', sans-serif" 
          font-size="10.5" 
          font-weight="600" 
          letter-spacing="3" 
          fill="#FBF3E7" 
          text-anchor="middle">SATARA</text>
  </g>

  <!-- Bottom Delicate Arch Accent -->
  <path d="M180 405 Q250 425 320 405" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
</svg>
