<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <!-- Background Gradient Deep Aubergine / Wine -->
    <radialGradient id="bgGrad2" cx="70%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#4F1640" />
      <stop offset="45%" stop-color="#330D29" />
      <stop offset="100%" stop-color="#1A0414" />
    </radialGradient>

    <!-- Gold Foil Gradient -->
    <linearGradient id="goldJewel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="25%" stop-color="#E5C358" />
      <stop offset="60%" stop-color="#C9A227" />
      <stop offset="85%" stop-color="#8C6709" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>

    <!-- Ruby Red Stone Gradient -->
    <radialGradient id="rubyStone" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#FF4B72" />
      <stop offset="50%" stop-color="#C2185B" />
      <stop offset="100%" stop-color="#6B0527" />
    </radialGradient>

    <!-- Emerald Green Stone Gradient -->
    <radialGradient id="emeraldStone" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#26A69A" />
      <stop offset="60%" stop-color="#00695C" />
      <stop offset="100%" stop-color="#00332C" />
    </radialGradient>

    <!-- Mandala Pattern -->
    <pattern id="jewelPattern" width="100" height="100" patternUnits="userSpaceOnUse" opacity="0.06">
      <polygon points="50,10 62,38 90,50 62,62 50,90 38,62 10,50 38,38" fill="none" stroke="#C9A227" stroke-width="1"/>
      <circle cx="50" cy="50" r="12" fill="none" stroke="#C9A227" stroke-width="1"/>
    </pattern>

    <filter id="shadowJewel" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bgGrad2)"/>
  <rect width="1600" height="900" fill="url(#jewelPattern)"/>

  <!-- Radial Shimmers -->
  <circle cx="1180" cy="420" r="380" fill="#E5C358" opacity="0.1" filter="blur(60px)"/>
  <circle cx="1320" cy="520" r="260" fill="#C2185B" opacity="0.12" filter="blur(50px)"/>

  <!-- Heritage Jewellery Choker & Jhumkas Showcase Illustration -->
  <g transform="translate(1160, 420)" filter="url(#shadowJewel)">
    <!-- Ornate Halo Arch -->
    <circle cx="0" cy="0" r="310" fill="none" stroke="url(#goldJewel)" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.5"/>
    <circle cx="0" cy="0" r="280" fill="none" stroke="url(#goldJewel)" stroke-width="2" opacity="0.7"/>

    <!-- Temple Choker Arc -->
    <g transform="translate(0, -60) scale(1.1)">
      <!-- Main Choker Base Band -->
      <path d="M-150,-40 Q0,80 150,-40" fill="none" stroke="url(#goldJewel)" stroke-width="36" stroke-linecap="round"/>
      <path d="M-150,-40 Q0,80 150,-40" fill="none" stroke="#330D29" stroke-width="14" stroke-linecap="round"/>

      <!-- Kundan Insets along the choker curve -->
      <g fill="url(#rubyStone)" stroke="url(#goldJewel)" stroke-width="2">
        <circle cx="-110" cy="-20" r="10"/>
        <circle cx="-75" cy="4" r="11"/>
        <circle cx="-38" cy="22" r="12"/>
        <circle cx="0" cy="28" r="14" fill="url(#emeraldStone)"/>
        <circle cx="38" cy="22" r="12"/>
        <circle cx="75" cy="4" r="11"/>
        <circle cx="110" cy="-20" r="10"/>
      </g>

      <!-- Dangling Pearl Drops along choker bottom -->
      <g fill="#FFFFFF" stroke="url(#goldJewel)" stroke-width="1.5">
        <circle cx="-110" cy="2" r="5"/>
        <circle cx="-75" cy="28" r="5.5"/>
        <circle cx="-38" cy="48" r="6"/>
        <circle cx="0" cy="56" r="7"/>
        <circle cx="38" cy="48" r="6"/>
        <circle cx="75" cy="28" r="5.5"/>
        <circle cx="110" cy="2" r="5"/>
      </g>
    </g>

    <!-- Left Traditional Kundan Jhumka -->
    <g transform="translate(-130, 100) scale(1.05)">
      <!-- Ear Stud Motif -->
      <circle cx="0" cy="-40" r="18" fill="url(#rubyStone)" stroke="url(#goldJewel)" stroke-width="3"/>
      <circle cx="0" cy="-40" r="8" fill="#FFFFFF"/>
      
      <!-- Connecting Link -->
      <line x1="0" y1="-22" x2="0" y2="-8" stroke="url(#goldJewel)" stroke-width="3"/>

      <!-- Bell / Jhumka Dome -->
      <path d="M-30,18 C-30,-12 30,-12 30,18 Z" fill="url(#goldJewel)" stroke="url(#goldJewel)" stroke-width="2"/>
      <ellipse cx="0" cy="18" rx="30" ry="8" fill="#543C08" stroke="url(#goldJewel)" stroke-width="2"/>

      <!-- Hanging Tiny Cluster Pearls -->
      <circle cx="-24" cy="30" r="3.5" fill="#FFFFFF"/>
      <circle cx="-12" cy="32" r="3.5" fill="#FFFFFF"/>
      <circle cx="0" cy="34" r="4" fill="#FFFFFF"/>
      <circle cx="12" cy="32" r="3.5" fill="#FFFFFF"/>
      <circle cx="24" cy="30" r="3.5" fill="#FFFFFF"/>
    </g>

    <!-- Right Matching Jhumka -->
    <g transform="translate(130, 100) scale(1.05)">
      <!-- Ear Stud Motif -->
      <circle cx="0" cy="-40" r="18" fill="url(#rubyStone)" stroke="url(#goldJewel)" stroke-width="3"/>
      <circle cx="0" cy="-40" r="8" fill="#FFFFFF"/>
      
      <!-- Connecting Link -->
      <line x1="0" y1="-22" x2="0" y2="-8" stroke="url(#goldJewel)" stroke-width="3"/>

      <!-- Bell / Jhumka Dome -->
      <path d="M-30,18 C-30,-12 30,-12 30,18 Z" fill="url(#goldJewel)" stroke="url(#goldJewel)" stroke-width="2"/>
      <ellipse cx="0" cy="18" rx="30" ry="8" fill="#543C08" stroke="url(#goldJewel)" stroke-width="2"/>

      <!-- Hanging Tiny Cluster Pearls -->
      <circle cx="-24" cy="30" r="3.5" fill="#FFFFFF"/>
      <circle cx="-12" cy="32" r="3.5" fill="#FFFFFF"/>
      <circle cx="0" cy="34" r="4" fill="#FFFFFF"/>
      <circle cx="12" cy="32" r="3.5" fill="#FFFFFF"/>
      <circle cx="24" cy="30" r="3.5" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Left Side Text Darkening Gradient -->
  <rect width="900" height="900" fill="url(#bgGrad2)" opacity="0.75"/>
</svg>
